name: taltos-app CI

on:
  push:
    paths:
      - "taltos-app/**"
      - ".github/workflows/taltos-app-ci.yml"
  pull_request:
    paths:
      - "taltos-app/**"
      - ".github/workflows/taltos-app-ci.yml"

# Csak olvasási jog; a workflow-ban nincs secret, így fork-PR-ből sem szivároghat semmi.
permissions:
  contents: read

concurrency:
  group: taltos-app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: taltos-app

# Az actionök teljes commit-SHA-ra rögzítve (a tag áthelyezhető); frissítés: Dependabot.
jobs:
  check:
    name: lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: taltos-app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: taltos-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  db:
    name: adatbázis-tesztek (migráció, seed, invariánsok)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Eldobható Postgres a futás idejére; a jelszó csak ehhez a service containerhez tartozó, nem valódi secret.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A TEST_DATABASE_URL egy superuser URL: a tesztek friss adatbázist és szerepköröket hoznak létre és dobnak el.
      TEST_DATABASE_URL: postgres://postgres:ci-throwaway@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: taltos-app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: taltos-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @taltos/backend test

  compose:
    name: Compose-build és füstpróba
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A backend induláskor kötelezően kér OIDC-kliensazonosítót (a discovery lusta, a füstpróba nem hívja a szolgáltatót).
      OIDC_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      # A CI HTTP-n fut: a Secure süti ott nem tesztelhető.
      COOKIE_SECURE: "false"
      # Élesben (NODE_ENV=production) a nem https origin és a nem Secure süti tilos; a CI füstpróba http-n fut, ezért
      # kifejezett kivétel kell (valódi telepítésen soha).
      ALLOW_INSECURE_HTTP: "true"
      # Kötelező (D54), helyőrző nem valódi címmel; szerepel a config/allowlist.example.txt-ben (az init-szkript másolja).
      BOOTSTRAP_ADMIN_EMAIL: owner@example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/init-dev-secrets.mjs
      - run: docker compose -f compose.yaml config --quiet
      # Verziófüggetlen sorrend (a `up --wait` az egyszeri, 0-val kilépő `migrate` konténert Compose-verziótól függően
      # hibának vehetné): 1. Postgres (az init-szkript lefut), 2. a kép építése és a migráció (a kilépési kód terjed),
      # 3. a backend és a frontend a függőségek (már lefutott migráció) kihagyásával.
      - run: docker compose -f compose.yaml up --detach --wait --wait-timeout 120 postgres
      # A taltos_* szerepkörök megerősítése az init-szkript UTÁN (admin psql, helyi socket): nincs rolsuper/rolcreaterole/
      # rolcreatedb/rolreplication/rolbypassrls, és a taltos_backend nem kap CREATE/TEMP jogot az adatbázison, CREATE-et a public sémán.
      - name: szerepkörök ellenőrzése (B4 S23)
        run: docker compose -f compose.yaml exec -T postgres psql -U taltos_admin -d taltos -v ON_ERROR_STOP=1 -f - < db/checks/roles-hardening.sql
      - run: docker compose -f compose.yaml build backend
      - name: migráció (egyszeri)
        shell: bash
        run: docker compose -f compose.yaml run --rm migrate 2>&1 | tee migrate.log
      - run: docker compose -f compose.yaml up --build --detach --wait --wait-timeout 180 --no-deps backend frontend
      # WP0 „kész”: a frontend és a backend válaszol, mindkét WebSocket-útvonal fogad.
      - run: node scripts/smoke.mjs http://localhost:8080
      - if: failure()
        run: docker compose -f compose.yaml logs --no-color
      # A lépésnapló csak bejelentkezve olvasható; hibánál a naplók vége annotációként is megjelenik.
      # A CI-secretek futásonként generált, eldobható értékek.
      - name: hibanaplók annotációként
        if: failure()
        shell: bash
        run: |
          annotate() {
            [ -s "$2" ] || return 0
            msg="$(tail -n 40 "$2" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=$1::$msg"
          }
          docker compose -f compose.yaml logs --no-color --tail 60 postgres > postgres.log 2>&1 || true
          docker compose -f compose.yaml logs --no-color --tail 40 backend frontend > app.log 2>&1 || true
          annotate "postgres napló" postgres.log
          annotate "migrate kimenet" migrate.log
          annotate "backend/frontend napló" app.log
      - if: always()
        run: docker compose -f compose.yaml down --volumes
