name: taltos-app CI

on:
  push:
    paths:
      - 'taltos-app/**'
      - '.github/workflows/taltos-app-ci.yml'
  pull_request:
    paths:
      - 'taltos-app/**'
      - '.github/workflows/taltos-app-ci.yml'

# Csak olvasási jog; a workflow-ban nincs secret, így fork-PR-ből sem szivároghat semmi.
permissions:
  contents: read

concurrency:
  group: taltos-app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: taltos-app

# Az actionök teljes commit-SHA-ra rögzítve (a tag áthelyezhető); frissítés: Dependabot.
jobs:
  check:
    name: lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: taltos-app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: taltos-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  compose:
    name: Compose-build és füstpróba
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/init-dev-secrets.mjs
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f compose.yaml up --build --detach --wait --wait-timeout 180
      # WP0 „kész”: a frontend és a backend válaszol, mindkét WebSocket-útvonal fogad.
      - run: node scripts/smoke.mjs http://localhost:8080
      - if: failure()
        run: docker compose -f compose.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml down --volumes
