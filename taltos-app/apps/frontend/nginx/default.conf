# Táltos frontend + reverse proxy (D50): egyetlen origin a böngészőnek, így a session-cookie
# és a CSRF egyszerű marad. WebSocket-upgrade a /collab és a /ws/notifications útvonalon (WP0).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # A Docker beépített DNS-e; a változós proxy_pass miatt a backend címét futás közben oldja
    # fel, így a backend-konténer újralétrehozása (új IP) után sem ragad a régi címen.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $taltos_backend http://backend:3000;

    # Biztonsági fejlécek; a location-ök nem adnak saját add_header-t, így ezek mindenhol érvényesek.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass $taltos_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Connection "";
    }

    # Bejelentkezés, callback és kijelentkezés (WP2): ugyanazon az origin-en, hogy a session-süti
    # first-party maradjon.
    location /auth/ {
        proxy_pass $taltos_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Connection "";
    }

    location = /healthz {
        proxy_pass $taltos_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Connection "";
    }

    # Valós idejű csatornák (D29, D46): hosszú életű kapcsolatok, ezért hosszú idle timeout;
    # a backend 30 másodpercenként pingel, így az élő kapcsolat ezt sosem éri el.
    location = /collab {
        proxy_pass $taltos_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /ws/notifications {
        proxy_pass $taltos_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Alkalmazásszintű statikus képek a mountolt assets-volume-ról (D15); csere = fájlmásolás.
    location /static/ {
        alias /srv/static/;
        try_files $uri =404;
        disable_symlinks on;
        expires 1h;
    }

    # A Vite hash-elt buildkimenete: sokáig gyorsítótárazható.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA: minden más útvonal az index.html-re esik vissza, amit nem gyorsítótárazunk.
    location / {
        try_files $uri /index.html;
        expires epoch;
    }
}
