# A proxy_set_header nem öröklődik, ha a location saját proxy_set_header-t ad, ezért
# minden backend-felé menő location ezt az egy fájlt húzza be.
proxy_http_version 1.1;
# A port is kell (a $host elhagyná), pl. a WP2 OIDC-visszahívási URL-jéhez.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Csak a valódi kapcsolat címe: a kliens saját X-Forwarded-For fejlécét eldobjuk, a backend
# pontosan egy hopot bízik meg (TRUST_PROXY=1). Ha az nginx elé céges TLS-terminátor kerül,
# itt set_real_ip_from + real_ip_header kell.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
