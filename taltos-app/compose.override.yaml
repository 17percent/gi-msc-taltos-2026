# Csak fejlesztés: a `docker compose up` automatikusan betölti.
services:
  # A http://localhost-on futó dev-környezetben a Secure süti nem minden böngészőben működik (Safari).
  backend:
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # A http://localhost-os dev-környezet kifejezett kivétele az éles HTTPS-szabály alól.
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}

  # E-mail-mock (D11, D46): a levelek a webes felületen nézhetők meg (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

  # Dummy fejlesztői adat (D11, WP1): `docker compose --profile seed run --rm seed` (előtte egyszer `up --build`).
  # A taltos_backend (app) szerepkörrel fut, NODE_ENV=development és TALTOS_ALLOW_SEED=1 nélkül a seed megtagadja a futást.
  seed:
    image: taltos-backend
    pull_policy: never
    profiles: [seed]
    command: ['node', 'dist/db/seed.js']
    environment:
      NODE_ENV: development
      # Fail-closed seed-védelem: kifejezett engedély nélkül a seed nem fut (apps/backend/src/db/seed-guard.ts).
      TALTOS_ALLOW_SEED: '1'
      DB_HOST: postgres
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_app_password]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
