# Táltos alap-Compose (WP0, WP1). Fejlesztésben a `docker compose up` a compose.override.yaml-t is
# betölti (Mailpit, seed); élesre csak ez a fájl: `docker compose -f compose.yaml up`.
# Indulás előtt: `pnpm secrets:init` (a secrets/ mappa fájljai, lásd secrets/README.md).
name: taltos

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taltos
      POSTGRES_USER: taltos_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      # Az init-szkript (db/initdb, csak első indításkor) ezekből hozza létre a login-szerepköröket (B4 S23).
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
    # A DB-szerver csak a saját szerepköreinek jelszavát kapja; az OIDC- és SMTP-secretet csak a backend (D13).
    secrets: [db_superuser_password, db_migrator_password, db_app_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP-n (127.0.0.1) kérdez: az inicializálás alatti ideiglenes szerver csak unix-socketen hallgat,
      # ezért a szolgáltatás csak az init-szkript lefutása UTÁN válik egészségessé. A szerepkör-ellenőrzés
      # (helyi socket) azt fogja meg, ha az init-szkript elbukott, és a konténer újraindulva szerepkörök
      # nélkül futna: ilyenkor sosem lesz egészséges, a hiba nem rejtőzik el.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U taltos_admin -d taltos &&
          psql -U taltos_admin -d taltos -tAc
          "SELECT count(*) FROM pg_roles WHERE rolname IN ('taltos_migrator', 'taltos_backend')"
          | grep -qx 2
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Egyszeri migráció (WP1): ugyanaz a backend-image, a taltos_migrator login-szerepkörrel (a NOLOGIN taltos_owner tagja).
  # A backend soha nem kapja meg a migrátor jelszavát és DDL-jogot sem (B4 S23).
  # Nincs saját `build`: a képet a `backend` építi (egyszer); a `migrate` és a dev `seed` ugyanazt a `taltos-backend` képet használja.
  migrate:
    image: taltos-backend
    pull_policy: never
    command: ['node', 'dist/db/migrate.js']
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets: [db_migrator_password]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: taltos-backend
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_VERSION: ${APP_VERSION:-dev}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # A közvetlen proxy (a frontend-konténer nginx-e, D50) a Compose privát hálózatáról jön;
      # a backend csak ezt az egy hopot bízza meg, a kliens saját X-Forwarded-For-ját nem.
      TRUST_PROXY: uniquelocal
      # Az alkalmazás a taltos_backend (a taltos_app tagja) szerepkörrel csatlakozik: DML, DELETE csak a D51 j táblákon.
      DB_HOST: postgres
      DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # Bejelentkezés (WP2, D5, D53): a PUBLIC_ORIGIN + /auth/callback a Google OAuth-kliensben engedélyezett átirányítás.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      # Secure süti; a http://localhost-os fejlesztésben a compose.override.yaml kikapcsolja.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Élesben (NODE_ENV=production) a COOKIE_SECURE=false és a nem https PUBLIC_ORIGIN indításkor hibát ad; kizárólag a
      # CI füstpróba (http) és a dev-override állítja true-ra.
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      # A rendszerindító felhasználó (D54): amíg nincs Rendszeradmin, csak ez az e-mail léphet be (és kell az allowlisten lennie).
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      ALLOWLIST_FILE: /etc/taltos/allowlist.txt
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets: [db_app_password, oidc_client_secret, smtp_password]
    # Az allowlist forrása (D53): a konfig-fájl csak olvashatóan; az indulás szinkronizálja az adatbázisba.
    volumes:
      - ./config/allowlist.txt:/etc/taltos/allowlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080'
    volumes:
      - assets:/srv/static:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  assets:

secrets:
  db_superuser_password:
    file: ./secrets/db_superuser_password.txt
  db_migrator_password:
    file: ./secrets/db_migrator_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
  oidc_client_secret:
    file: ./secrets/oidc_client_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt
